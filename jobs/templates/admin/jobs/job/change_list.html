{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {{ block.super }}
  <li><a href="{% url 'admin:jobs_job_export_csv' %}">Скачать все вакансии (CSV)</a></li>
  {% if request.user.is_superuser %}
    <li>
      <form action="{% url 'admin:jobs_job_run_details' %}" method="post">
        {% csrf_token %}
        <button class="button" type="submit">Запустить обработку Details</button>
      </form>
    </li>
  {% endif %}
{% endblock %}
